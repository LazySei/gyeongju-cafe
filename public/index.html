<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경주시 카페 및 찻집 정보</title>
    <style>
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            padding: 20px; 
            background-color: #f4f4f9; 
            max-width: 1200px; /* 2개씩 보이도록 최대 너비 확장 */
            margin: 0 auto; 
        }
        
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }

        /* 💡 1. 한 줄에 2개씩 배치하는 Grid 레이아웃 */
        #cafe-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2열 배치 */
            gap: 20px; /* 카드 사이 간격 */
        }

        /* 카드 내부를 Flexbox로 구성하여 버튼이 항상 바닥에 오도록 설정 */
        .cafe-card { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }
        
        /* 💡 2. 이미지 사이즈를 완벽하게 동일하게 맞춤 */
        .cafe-img { 
            width: 100%; 
            height: 250px; /* 모든 이미지를 250px 높이로 고정 */
            object-fit: cover; /* 비율을 유지하면서 여백 없이 꽉 채움 (잘림 허용) */
            border-radius: 8px; 
            margin-bottom: 15px; 
            background-color: #eee; /* 이미지 로딩 전 배경색 */
        }

        .cafe-name { font-size: 1.4em; font-weight: bold; color: #2c3e50; margin-bottom: 8px; }
        .cafe-addr { color: #7f8c8d; font-size: 0.95em; margin-bottom: 10px; }
        
        .cafe-summary { 
            margin-top: 10px; 
            font-size: 0.9em; 
            color: #444; 
            background: #f8f9fa; 
            padding: 12px; 
            border-radius: 6px; 
            line-height: 1.5; 
        }
        
        .cafe-content { 
            margin-top: 15px; 
            font-size: 0.95em; 
            color: #333; 
            line-height: 1.6; 
            border-top: 1px dashed #eee; 
            padding-top: 15px; 
            flex-grow: 1; /* 남은 공간을 모두 차지하게 하여 버튼을 바닥으로 밀어냄 */
        }
        
        .cafe-link { 
            display: block; 
            text-align: center;
            margin-top: 20px; 
            padding: 12px; 
            background-color: #3498db; 
            color: white; 
            text-decoration: none; 
            border-radius: 6px; 
            font-size: 0.95em; 
            font-weight: bold; 
            transition: background-color 0.2s; 
        }
        .cafe-link:hover { background-color: #2980b9; }

        /* 💡 스마트폰 등 작은 화면에서는 자동으로 1줄에 1개씩 보이도록 반응형 처리 */
        @media (max-width: 768px) {
            #cafe-list {
                grid-template-columns: 1fr; /* 1열 배치 */
            }
        }
    </style>
</head>
<body>
    <h1>☕ 경주시 카페 및 찻집 안내</h1>
    <div id="cafe-list">데이터를 불러오는 중입니다...</div>

    <script>
        async function loadCafes() {
            try {
                const response = await fetch('/api/cafes');
                const data = await response.json();
                
                const items = data.response?.body?.items?.item || [];
                const listDiv = document.getElementById('cafe-list');
                listDiv.innerHTML = '';

                if (items.length === 0) {
                    listDiv.innerHTML = '<p>조회된 데이터가 없습니다.</p>';
                    return;
                }

                items.forEach(cafe => {
                    const div = document.createElement('div');
                    div.className = 'cafe-card';
                    
                    div.innerHTML = `
                        ${cafe.CON_IMGFILENAME ? `<img src="${cafe.CON_IMGFILENAME}" alt="${cafe.CON_TITLE}" class="cafe-img" onerror="this.style.display='none'">` : ''}
                        <div class="cafe-name">${cafe.CON_TITLE || '이름 없음'}</div>
                        <div class="cafe-addr">📍 ${cafe.CON_ADDRESS || '주소 정보 없음'}</div>
                        
                        ${cafe.CON_SUMMARY ? `<div class="cafe-summary">${cafe.CON_SUMMARY}</div>` : ''}
                        
                        ${cafe.CON_CONTENT ? `<div class="cafe-content">${cafe.CON_CONTENT}</div>` : '<div class="cafe-content"></div>'}
                        
                        ${cafe.CON_HOMEPAGE ? `<a href="${cafe.CON_HOMEPAGE}" target="_blank" class="cafe-link">🌐 홈페이지 방문하기</a>` : ''}
                    `;
                    listDiv.appendChild(div);
                });
            } catch (error) {
                document.getElementById('cafe-list').innerText = '데이터를 불러오는데 실패했습니다.';
                console.error(error);
            }
        }
        loadCafes();
    </script>
</body>
</html>
